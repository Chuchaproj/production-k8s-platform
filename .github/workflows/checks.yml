name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: azure/setup-helm@v4.3.0
        with: {version: v3.18.3}
      - run: sudo apt-get update && sudo apt-get install -y shellcheck yamllint
      - run: make install test
      - run: .venv/bin/ruff check app tests scripts
      - run: shellcheck scripts/*.sh && yamllint -c .yamllint compose.yaml monitoring helm/platform/files .github
      - uses: hadolint/hadolint-action@v3.1.0
        with: {dockerfile: Dockerfile}
      - run: make helm-check manifests-check
      - run: make init up smoke
      - run: docker compose run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
      - run: docker compose run --rm --no-deps --entrypoint promtool prometheus test rules /etc/prometheus/rule-tests.yml
      - name: Image security report
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: platform-backend:local
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
      - if: always()
        run: docker compose logs --no-color && docker compose down
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
