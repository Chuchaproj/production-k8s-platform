name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: azure/setup-helm@v4.3.0
        with: {version: v3.18.3}
      - run: sudo apt-get update && sudo apt-get install -y shellcheck yamllint
      - run: make install test
      - run: .venv/bin/ruff check app tests scripts
      - run: shellcheck scripts/*.sh && yamllint -c .yamllint compose.yaml monitoring helm/platform/files .github
      - uses: hadolint/hadolint-action@v3.1.0
        with: {dockerfile: Dockerfile}
      - run: make helm-check manifests-check
      - name: Install Docker Compose
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/docker/compose/releases/download/v5.1.4/docker-compose-linux-x86_64
          curl -fsSLO https://github.com/docker/compose/releases/download/v5.1.4/checksums.txt
          sha256sum --ignore-missing -c checksums.txt
          mkdir -p "$HOME/.docker/cli-plugins"
          install -m 0755 docker-compose-linux-x86_64 "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
      - run: make init up smoke
      - run: docker compose run --rm --no-deps --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
      - run: docker compose run --rm --no-deps --entrypoint promtool prometheus test rules /etc/prometheus/rule-tests.yml
      - name: Image vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: platform-backend:local
          version: v0.75.0
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
      - if: always()
        run: |
          if [ -f .env ]; then
            docker compose logs --no-color
            docker compose down
          fi
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install Gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_checksums.txt
          sha256sum --ignore-missing -c gitleaks_8.30.0_checksums.txt
          tar -xzf gitleaks_8.30.0_linux_x64.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan complete history and current sources
        run: make secrets
