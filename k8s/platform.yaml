# Source: platform/templates/monitoring.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files: [/etc/prometheus/alerts.yml]
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['platform-alertmanager:9093']
    scrape_configs:
      - job_name: backend
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['default']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: 'platform-backend'
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http
            action: keep
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

  alerts.yml: |
    groups:
      - name: platform
        rules:
          - alert: BackendUnavailable
            expr: up{job="backend"} == 0
            for: 1m
            labels: {severity: critical}
            annotations: {summary: Backend metrics endpoint unavailable, runbook: RUNBOOK.md}
          - alert: BackendErrorRate
            expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.05
            for: 2m
            labels: {severity: warning}
            annotations: {summary: More than five percent server errors, runbook: RUNBOOK.md}
          - alert: BackendLatency
            expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
            for: 2m
            labels: {severity: warning}
            annotations: {summary: HTTP p95 exceeds 500ms, runbook: RUNBOOK.md}
          - alert: BackendMemory
            expr: process_resident_memory_bytes{job="backend"} > 200 * 1024 * 1024
            for: 5m
            labels: {severity: warning}
            annotations: {summary: Backend memory above lab threshold, runbook: RUNBOOK.md}
          - alert: DependencyFailure
            expr: sum by (dependency) (rate(dependency_failures_total[2m])) > 0
            for: 1m
            labels: {severity: warning}
            annotations: {summary: Required dependency failing, runbook: RUNBOOK.md}

          - alert: BackendCpuHigh
            expr: rate(process_cpu_seconds_total{job="backend"}[2m]) > 0.45
            for: 2m
            labels: {severity: warning}
            annotations: {summary: Backend near half-core CPU budget, runbook: RUNBOOK.md}

