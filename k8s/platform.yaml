apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-alertmanager
data:
  alertmanager.yml: |
    route:
      receiver: local-ui
      group_by: [alertname]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
    receivers:
      - name: local-ui


---
# Source: platform/templates/monitoring.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-loki
data:
  loki.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    schema_config:
      configs:
        - from: '2024-04-01'
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 168h
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem


