# Source: platform/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: platform-postgres
spec:
  serviceName: platform-postgres
  replicas: 1
  selector:
    matchLabels: {app: 'platform-postgres'}
  template:
    metadata:
      labels: {app: 'platform-postgres'}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16.9-bookworm
          ports: [{containerPort: 5432}]

          env:
            - {name: POSTGRES_USER, value: platform}
            - {name: POSTGRES_DB, value: platform}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: 'platform-secrets', key: POSTGRES_PASSWORD}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            exec: {command: [sh, -c, "pg_isready -U platform -d platform"]}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}

