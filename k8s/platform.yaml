# Source: platform/templates/monitoring.yaml
apiVersion: v1
kind: ConfigMap
metadata: {name: 'platform-alloy'}
data:
  config.alloy: |
    local.file_match "app" {
      path_targets = [{"__path__" = "/logs/*.log", "job" = "backend"}]
    }
    loki.source.file "app" {
      targets    = local.file_match.app.targets
      forward_to = [loki.write.local.receiver]
    }
    loki.write "local" {
      endpoint { url = "http://platform-loki:3100/loki/api/v1/push" }
    }

