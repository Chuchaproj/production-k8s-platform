apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
spec:
  ingressClassName: traefik
  rules:
    - host: platform.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-backend
                port: {number: 8000}
