# Source: platform/templates/app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-backend
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: 'platform-backend'}
  template:
    metadata:
      annotations:
        platform.homelab/release-revision: "1"
      labels: {app: 'platform-backend'}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: 'platform-backend'}
      containers:
        - name: backend
          image: "platform-backend:local"
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000, name: http}]
          envFrom:
            - configMapRef: {name: 'platform-config'}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: 'platform-secrets', key: DATABASE_URL}
            - name: LOG_DIR
              value: /logs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /live, port: http}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /live, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: logs, mountPath: /logs}
        - name: alloy
          image: grafana/alloy:v1.9.1
          args: [run, /etc/alloy/config.alloy, --storage.path=/tmp/alloy]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: logs, mountPath: /logs, readOnly: true}
            - {name: alloy-config, mountPath: /etc/alloy}
            - {name: alloy-tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: logs, emptyDir: {}}
        - {name: alloy-config, configMap: {name: 'platform-alloy'}}
        - {name: alloy-tmp, emptyDir: {}}

