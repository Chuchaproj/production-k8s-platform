apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  selector: {app: '{{ .Release.Name }}-postgres'}
  ports: [{port: 5432, name: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels: {app: '{{ .Release.Name }}-postgres'}
  template:
    metadata:
      labels: {app: '{{ .Release.Name }}-postgres'}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16.9-bookworm
          ports: [{containerPort: 5432}]

          env:
            - {name: POSTGRES_USER, value: platform}
            - {name: POSTGRES_DB, value: platform}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: '{{ .Values.secretName }}', key: POSTGRES_PASSWORD}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            exec: {command: [sh, -c, "pg_isready -U platform -d platform"]}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
