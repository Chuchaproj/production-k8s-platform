{{- if .Values.monitoring.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files: [/etc/prometheus/alerts.yml]
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['{{ .Release.Name }}-alertmanager:9093']
    scrape_configs:
      - job_name: backend
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['{{ .Release.Namespace }}']
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: '{{ .Release.Name }}-backend'
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: http
            action: keep
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

  alerts.yml: |
{{ regexReplaceAll "(?m)^ +$" (.Files.Get "files/alerts.yml" | trim | indent 4) "" }}
---
apiVersion: v1
kind: Service
metadata: {name: '{{ .Release.Name }}-prometheus'}
spec:
  selector: {app: '{{ .Release.Name }}-prometheus'}
  ports: [{port: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: '{{ .Release.Name }}-prometheus'}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: '{{ .Release.Name }}-prometheus'}
  template:
    metadata:
      annotations:
        platform.homelab/release-revision: "{{ .Release.Revision }}"
      labels: {app: '{{ .Release.Name }}-prometheus'}
    spec:
      serviceAccountName: {{ .Release.Name }}-prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.4.1
          args: ['--config.file=/etc/prometheus/prometheus.yml']
          ports: [{containerPort: 9090}]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - {name: config, configMap: {name: '{{ .Release.Name }}-prometheus'}}
        - {name: data, persistentVolumeClaim: {claimName: '{{ .Release.Name }}-prometheus'}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: '{{ .Release.Name }}-prometheus'}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-alertmanager
data:
  alertmanager.yml: |
{{ regexReplaceAll "(?m)^ +$" (.Files.Get "files/alertmanager.yml" | trim | indent 4) "" }}
---
apiVersion: v1
kind: Service
metadata: {name: '{{ .Release.Name }}-alertmanager'}
spec:
  selector: {app: '{{ .Release.Name }}-alertmanager'}
  ports: [{port: 9093}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: '{{ .Release.Name }}-alertmanager'}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: '{{ .Release.Name }}-alertmanager'}
  template:
    metadata:
      annotations:
        platform.homelab/release-revision: "{{ .Release.Revision }}"
      labels: {app: '{{ .Release.Name }}-alertmanager'}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args: ['--config.file=/etc/alertmanager/alertmanager.yml']
          ports: [{containerPort: 9093}]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager}
            - {name: data, mountPath: /alertmanager}
      volumes:
        - {name: config, configMap: {name: '{{ .Release.Name }}-alertmanager'}}
        - {name: data, persistentVolumeClaim: {claimName: '{{ .Release.Name }}-alertmanager'}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: '{{ .Release.Name }}-alertmanager'}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-loki
data:
  loki.yml: |
{{ regexReplaceAll "(?m)^ +$" (.Files.Get "files/loki.yml" | trim | indent 4) "" }}
---
apiVersion: v1
kind: Service
metadata: {name: '{{ .Release.Name }}-loki'}
spec:
  selector: {app: '{{ .Release.Name }}-loki'}
  ports: [{port: 3100}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: '{{ .Release.Name }}-loki'}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: '{{ .Release.Name }}-loki'}
  template:
    metadata:
      annotations:
        platform.homelab/release-revision: "{{ .Release.Revision }}"
      labels: {app: '{{ .Release.Name }}-loki'}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: loki
          image: grafana/loki:3.5.1
          args: ['-config.file=/etc/loki/loki.yml']
          ports: [{containerPort: 3100}]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
      volumes:
        - {name: config, configMap: {name: '{{ .Release.Name }}-loki'}}
        - {name: data, persistentVolumeClaim: {claimName: '{{ .Release.Name }}-loki'}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: '{{ .Release.Name }}-loki'}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: '{{ .Release.Name }}-prometheus'}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: '{{ .Release.Name }}-prometheus'}
rules:
  - apiGroups: ['']
    resources: [services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: '{{ .Release.Name }}-prometheus'}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-prometheus
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: '{{ .Release.Name }}-prometheus'}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: '{{ .Release.Name }}-alloy'}
data:
  config.alloy: |
    local.file_match "app" {
      path_targets = [{"__path__" = "/logs/*.log", "job" = "backend"}]
    }
    loki.source.file "app" {
      targets    = local.file_match.app.targets
      forward_to = [loki.write.local.receiver]
    }
    loki.write "local" {
      endpoint { url = "http://{{ .Release.Name }}-loki:3100/loki/api/v1/push" }
    }
---
apiVersion: v1
kind: ConfigMap
metadata: {name: '{{ .Release.Name }}-grafana'}
data:
  sources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ .Release.Name }}-prometheus:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://{{ .Release.Name }}-loki:3100
  provider.yml: |
    apiVersion: 1
    providers:
      - name: homelab
        type: file
        options:
          path: /etc/grafana/provisioning/dashboards
  platform.json: |
{{ regexReplaceAll "(?m)^ +$" (.Files.Get "files/platform.json" | trim | indent 4) "" }}
---
apiVersion: v1
kind: Service
metadata: {name: '{{ .Release.Name }}-grafana'}
spec:
  selector: {app: '{{ .Release.Name }}-grafana'}
  ports: [{port: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: '{{ .Release.Name }}-grafana'}
spec:
  replicas: 1
  selector:
    matchLabels: {app: '{{ .Release.Name }}-grafana'}
  template:
    metadata:
      annotations:
        platform.homelab/release-revision: "{{ .Release.Revision }}"
      labels: {app: '{{ .Release.Name }}-grafana'}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 472}
      containers:
        - name: grafana
          image: grafana/grafana:12.0.2
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: '{{ .Values.secretName }}', key: GRAFANA_PASSWORD}
          resources:
            requests: {cpu: 25m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          ports: [{containerPort: 3000}]
          volumeMounts:
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/sources.yml, subPath: sources.yml}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/provider.yml, subPath: provider.yml}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/platform.json, subPath: platform.json}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - {name: config, configMap: {name: '{{ .Release.Name }}-grafana'}}
        - {name: data, emptyDir: {}}
{{- end }}
