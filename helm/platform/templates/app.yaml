apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  REDIS_URL: redis://{{ .Release.Name }}-redis:6379/0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: '{{ .Release.Name }}-backend'}
  template:
    metadata:
      labels: {app: '{{ .Release.Name }}-backend'}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: '{{ .Release.Name }}-backend'}
      containers:
        - name: backend
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000, name: http}]
          envFrom:
            - configMapRef: {name: '{{ .Release.Name }}-config'}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: '{{ .Values.secretName }}', key: DATABASE_URL}
            - name: LOG_DIR
              value: /logs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          startupProbe:
            httpGet: {path: /live, port: http}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /live, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: logs, mountPath: /logs}
        {{- if .Values.monitoring.enabled }}
        - name: alloy
          image: grafana/alloy:v1.9.1
          args: [run, /etc/alloy/config.alloy, --storage.path=/tmp/alloy]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: logs, mountPath: /logs, readOnly: true}
            - {name: alloy-config, mountPath: /etc/alloy}
            - {name: alloy-tmp, mountPath: /tmp}
        {{- end }}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: logs, emptyDir: {}}
        {{- if .Values.monitoring.enabled }}
        - {name: alloy-config, configMap: {name: '{{ .Release.Name }}-alloy'}}
        - {name: alloy-tmp, emptyDir: {}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
spec:
  selector: {app: '{{ .Release.Name }}-backend'}
  ports: [{port: 8000, targetPort: http, name: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-backend
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: '{{ .Release.Name }}-backend'}
{{- if .Values.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-backend
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: '{{ .Release.Name }}-backend'}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port: {number: 8000}
{{- end }}
