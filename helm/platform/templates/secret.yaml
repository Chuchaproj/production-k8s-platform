{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword must come from a protected values file" .Values.secrets.postgresPassword | quote }}
  GRAFANA_PASSWORD: {{ required "secrets.grafanaPassword must come from a protected values file" .Values.secrets.grafanaPassword | quote }}
  DATABASE_URL: {{ required "secrets.databaseUrl must come from a protected values file" .Values.secrets.databaseUrl | quote }}
{{- end }}
